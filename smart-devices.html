<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأجهزة الذكية | كلمات المصطفى للاتصالات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="smart">

  <div id="site-header"></div>

  <main class="container">
    <section
  class="category-promo"
  id="categoryPromo"
  data-category="smart"
  aria-label="عروض الأجهزة الذكية">
  <div class="category-promo-slides"></div>

  <button class="category-promo-arrow prev"
          type="button"
          aria-label="العرض السابق">›</button>

  <button class="category-promo-arrow next"
          type="button"
          aria-label="العرض التالي">‹</button>

  <div class="category-promo-bottom">
    <div class="category-promo-dots"></div>
    <span class="category-promo-count">01 / 05</span>
  </div>
</section>
    <div class="page-title">
      <h1 id="pageTitle"></h1>
      <p id="pageDesc"></p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
